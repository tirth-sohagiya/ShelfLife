services:
  postgres:
    image: postgres:16
    container_name: donation-matching-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka in KRaft mode (no Zookeeper needed - removed as of Kafka 4.0).
  # "combined mode" (broker + controller in one process) is only for local
  # dev/learning; production setups run controller and broker separately.
  broker:
    image: apache/kafka:4.2.0
    hostname: broker
    container_name: donation-matching-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  # Optional but recommended while learning: web UI to watch topics/messages
  # in real time instead of trusting Kafka blindly.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: donation-matching-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
    depends_on:
      - broker

  donation-service:
    build:
      context: ./services/donation-service
    container_name: donation-matching-donation-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/donation_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

  request-service:
    build:
      context: ./services/request-service
    container_name: donation-matching-request-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/request_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

  matching-service:
    build:
      context: ./services/matching-service
    container_name: donation-matching-matching-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matching_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

volumes:
  postgres_data:
