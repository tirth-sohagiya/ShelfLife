server:
  port: 8081

spring:
  application:
    name: donation-service
  datasource:
    url: jdbc:postgresql://localhost:5432/donation_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      # ddl-auto: update is fine while we're actively iterating on the schema
      # during learning/build-out. Swap to a migration tool (Flyway/Liquibase)
      # before calling this production-grade - worth noting as a follow-up.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    # Producer/consumer beans defined in KafkaProducerConfig, KafkaConsumerConfig.
    consumer:
      group-id: donation-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
